  <g fill="none" stroke="url(#smGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 'S' Path -->
    <path d="M 27 22 C 22 21 17 24 17 28 C 17 33 28 32 28 37 C 28 42 22 44 17 42" />
    <!-- 'M' Path -->
    <path d="M 35 42 V 22 L 42 33 L 49 22 V 42" />
  </g>
  <!-- Accent Beacon Point -->
  <circle cx="51" cy="42" r="1.8" fill="#67E8F9" />
